spring:
  application:
    name: big-event
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/big_event?characterEncoding=utf-8
    username: root
    password: 11111111

  data:
    redis:
      host: localhost
      port: 6379

  profiles:
